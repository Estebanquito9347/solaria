<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SolarIA</title>
  
  <!-- Configuración PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <header id="top" hidden>
    <div class="brand">
      <h1><span class="brand-mark">☀</span> <span>SolarIA</span></h1>
      <p>Monitoreo inteligente de energía solar</p>
    </div>
    <div class="row">
      <label>Proyecto<select id="cur"></select></label>
      <span id="who"></span>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>
  <nav id="nav" aria-label="Secciones" hidden></nav>
  <main id="app"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="ia.js"></script>

  <!-- Registro del Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/solaria/sw.js')
          .then((reg) => console.log('SW registrado:', reg.scope))
          .catch((err) => console.error('Error al registrar SW:', err));
      });
    }
  </script>
</body>
</html>
